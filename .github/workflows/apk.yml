name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          mkdir -p www
          cp index.html sw.js www/
      - run: npx cap add android
      - name: Add external player plugin
        run: |
          D=android/app/src/main/java/com/arabtv/app
          mkdir -p $D
          cat > $D/ExtPlayer.java <<'JAVA'
          package com.arabtv.app;
          import android.content.Intent;
          import android.net.Uri;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "ExtPlayer")
          public class ExtPlayer extends Plugin {
            @PluginMethod
            public void open(PluginCall call) {
              String url = call.getString("url");
              String title = call.getString("title", "");
              String pkg = call.getString("pkg", "");
              try {
                Intent i = new Intent(Intent.ACTION_VIEW);
                i.setDataAndType(Uri.parse(url), "video/*");
                i.putExtra("title", title);
                Intent out = i;
                if (pkg != null && !pkg.isEmpty()) {
                  i.setPackage(pkg);
                } else {
                  out = Intent.createChooser(i, title);
                }
                out.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                getContext().startActivity(out);
                call.resolve();
              } catch (Exception e) {
                call.reject(String.valueOf(e.getMessage()));
              }
            }
          }
          JAVA
          cat > $D/MainActivity.java <<'JAVA'
          package com.arabtv.app;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              registerPlugin(ExtPlayer.class);
              super.onCreate(savedInstanceState);
            }
          }
          JAVA
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk arab-tv.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: arab-tv.apk
